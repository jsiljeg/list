<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161513">
<title>Theatrium by Filho — Wine &amp; Drinks List</title>
<meta name="description" content="Theatrium by Filho — digital wine and drinks list. Teslina 7, Zagreb.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

     /.well-known/tdmrep.json. -->

<meta name="tdm-policy" content="https://theatrium.list.devinos.hr/LICENSE">
<meta name="robots" content="index, follow, noai, noimageai">

<link rel="stylesheet" href="css/style.css">
<!-- The nail face is a background on .story-screen::before, which is display:none
     until a language is picked — so the browser would only start fetching it at
     the tap, and the story splash appeared bare for a beat (worst on phones).
     Preloading fetches it while the guest is still reading the language screen. -->
<!-- Measured 2026-08-12 (scratch/face-race.mjs), because the owner thought the
     face was slow: it is not, and never was. It is finished long before the
     language screen it sits behind even exists — 77ms against 367ms on wifi,
     3.2s against 4.4s throttled to 1.6 Mbps. What was slow was the whole app
     start, and that is fixed in init(). fetchpriority stays because it brings
     the image in half a second earlier (3.2s against 3.7s) and costs the
     first paint nothing measurable — the same 4.4s either way. -->
<link rel="preload" as="image" fetchpriority="high" href="assets/atrium-face.webp">
<!-- Nine of the ten flags are drawn inline in js/app.js and paint the instant
     the language buttons render. Croatia is the exception: its coat of arms is
     the official artwork, 196 paths and 69 kB, so it is an <img> rather than
     67 kB of path data pasted into the DOM on every call. That made it the
     only flag fetched over the wire — and the request could not even start
     until app.js had run and rendered the buttons, so it began at 260 ms with
     a megabyte of JSON already ahead of it in the queue. Croatia is first in
     the list, so its flag was reliably the last to appear (owner, 2026-08-03).
     Preloading starts it with the HTML instead. -->
<link rel="preload" as="image" href="assets/flag-hr.svg">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<!-- Language start screen -->
<div id="start" class="start hidden">
  <img class="start-logo" src="assets/theatrium-logo.svg" alt="Theatrium by Filho">
  <div class="lang-prompt">
    <span class="globe" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.4 3.9 5.6 3.9 9s-1.4 6.6-3.9 9c-2.5-2.4-3.9-5.6-3.9-9s1.4-6.6 3.9-9z"/></svg></span>
    <p id="start-title" class="start-title">Odaberite jezik · Choose your language</p>
  </div>
  <div id="lang-buttons" class="lang-buttons"></div>
</div>

<!-- Story splash (after language pick) -->
<div id="story-screen" class="start story-screen hidden">
  <img class="start-logo small clickable-logo" id="story-logo" src="assets/theatrium-logo.svg" alt="Theatrium by Filho" title="Theatrium by Filho">
  <div id="story-body" class="story"></div>
  <button id="story-enter" class="enter-btn"></button>
</div>

<!-- Main app -->
<div id="app" class="app hidden">
  <header class="header">
    <div class="header-actions">
      <button id="search-toggle" class="search-toggle" type="button" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/></svg></button>
      <div id="lang-switch" class="lang-switch"></div>
    </div>
    <img class="header-logo" src="assets/theatrium-logo.svg" alt="Theatrium by Filho" id="home-logo">
    <p class="header-subtitle" id="subtitle"></p>
    <div class="header-tools">
      <div class="tool-group">
        <button id="picks-toggle" class="tool-btn" type="button">★ <span></span></button>
        <button id="rated-toggle" class="tool-btn" type="button">🏆 <span></span></button>
        <button id="pride-toggle" class="tool-btn pride" type="button"><span></span></button>
        <button id="helper-open" class="tool-btn helper" type="button">🍷 <span></span></button>
      </div>
    </div>
    <div id="search-bar" class="search-bar">
      <input id="search" class="search" type="search" autocomplete="off">
      <button id="search-close" class="search-close" type="button" aria-label="Close search">✕</button>
    </div>
    <nav id="nav" class="nav"></nav>
  </header>
  <main id="content" class="content"></main>
  <footer class="footer">
    <p id="legal"></p>
    <p id="company"></p>
    <p id="copyright" class="footer-copyright"></p>
  </footer>
</div>

<!-- Wine detail modal -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-sheet" id="modal-sheet">
    <div class="sheet-grip" aria-hidden="true"></div>
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </div>
  <button class="modal-nav prev hidden" id="modal-prev" type="button">‹</button>
  <button class="modal-nav next hidden" id="modal-next" type="button">›</button>
</div>

<script src="js/i18n.js"></script>
<script src="js/maps.js"></script>
<script src="js/zh-terms.js"></script>
<script src="js/spirits.js"></script>
<script src="js/app.js"></script>
</body>
</html>
