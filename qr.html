<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theatrium by Filho — QR</title>
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500&family=Raleway:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:1.4rem; background:#efe9dd; color:#161513;
         font-family:"Raleway",sans-serif; text-align:center; padding:2rem; box-sizing:border-box; }
  img.logo { width:280px; filter: invert(1); }
  /* The vector code, so the card is as sharp as whatever prints it. The PNGs
     beside it in assets/ are for anyone who cannot place an SVG. */
  img.qr { width:min(420px, 80vw); }
  h1 { font-family:"Markazi Text",serif; font-weight:500; font-size:2rem; margin:0; letter-spacing:.04em; }
  p { margin:0; color:#5a5346; }
  .files { font-size:.82rem; letter-spacing:.04em; }
  .files a { color:#5a5346; }
  @media print { body { min-height:auto; } .files { display:none; } }
</style>
</head>
<body>
  <img class="logo" src="assets/theatrium-logo.svg" alt="Theatrium by Filho">
  <h1>Vinska karta · Wine list · Carta dei vini · Carte des vins<br>Weinkarte · Carta de vinos · 酒单</h1>
  <img class="qr" src="assets/qr.svg" alt="QR — https://theatrium.list.devinos.hr">
  <p>theatrium.list.devinos.hr</p>
  <p class="files">Za tisak: <a href="assets/qr.svg">qr.svg</a> (vektor) ·
     <a href="assets/qr-print.png">qr-print.png</a> (4920 px, 42 cm pri 300 dpi) ·
     <a href="assets/qr.png">qr.png</a> (1312 px)</p>
</body>
</html>
