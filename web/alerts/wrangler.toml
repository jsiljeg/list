# Theatrium's e-mail sender (see worker.js). Deployed by deploy-web.yml.
name = "theatrium-alerts"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

[vars]
MAIL_FROM = "alerts@devinos.hr"
MAIL_TO = "jures91@gmail.com"
# the Monday report also goes to Filho (owner, 2026-10-14). Every address
# here must be verified in Cloudflare Email Routing → Destination addresses.
MAIL_TO_WEEKLY = "jures91@gmail.com,filip.horvat1312@gmail.com"

# Can only deliver to this address, which is verified in Email Routing for
# devinos.hr. Change both here and in the Cloudflare dashboard, never one.
[[send_email]]
name = "MAIL"
allowed_destination_addresses = ["jures91@gmail.com", "filip.horvat1312@gmail.com"]
