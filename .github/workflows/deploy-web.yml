# The new restaurant site (web/) → Cloudflare Pages.
#
# Deliberately a separate workflow from deploy.yml: that one publishes the wine
# list to GitHub Pages and must not be touched by work here. The two share a
# repo and nothing else — different output, different host, different trigger.
name: Deploy web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      # the new site reads these at build time, so a menu or wine change
      # should rebuild the dish pages
      - "data/menu.json"
      - "library/wines.json"
      - "lists/theatrium.json"
  workflow_dispatch:

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Reuses the environment the wine list already stores its Cloudflare token
    # in. Expanding a token's permissions in Cloudflare does not change its
    # value, so the secret stored here is the same string and now reaches Pages
    # and D1 too — the owner only has to add the account id.
    environment: theatrium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: web
        run: npm ci

      - name: Generate dish → wine pairings
        working-directory: web
        # Reads the wine list's own files. Fails on a pairing tag with no
        # Croatian word rather than printing the raw tag.
        run: node scripts/build-pairings.mjs

      - name: Build
        working-directory: web
        run: npx astro build

      # Create the Pages project and the database on first run, so the only
      # thing a human ever supplies is the two secrets. Every step is
      # idempotent: it checks before it creates, and schema.sql is written with
      # IF NOT EXISTS throughout.
      - name: Ensure Cloudflare resources exist
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if ! npx wrangler pages project list 2>/dev/null | grep -q 'theatrium-web'; then
            echo "creating Pages project"
            npx wrangler pages project create theatrium-web --production-branch=main
          fi

          id=$(npx wrangler d1 list --json 2>/dev/null                  | jq -r '.[] | select(.name == "theatrium") | .uuid' || true)
          if [ -z "${id:-}" ] || [ "$id" = "null" ]; then
            echo "creating D1 database"
            npx wrangler d1 create theatrium >/dev/null
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "theatrium") | .uuid')
          fi
          echo "D1 id: ${id:0:8}…"

          # wrangler.toml ships a placeholder rather than a real id, because the
          # id is account-specific and belongs to whoever deploys, not to the repo.
          sed -i "s/PASTE_AFTER_wrangler_d1_create/$id/" wrangler.toml

          npx wrangler d1 execute theatrium --remote --file=schema.sql -y

      # Attach theatrium.devinos.hr, once. Idempotent and non-fatal: a failure
      # here must not stop a deploy that is otherwise fine, because the site is
      # always reachable on its pages.dev address regardless.
      #
      # One level of subdomain on purpose. Cloudflare's Universal SSL covers
      # *.devinos.hr but not a second level — the wine list hit exactly that on
      # theatrium.list.devinos.hr and had to go DNS-only to get a certificate.
      # Pages needs the record proxied, so a two-level name would have no cert.
      - name: Attach the custom domain
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
          HOST: theatrium.devinos.hr
        run: |
          set -uo pipefail
          [ -n "${CF_ZONE:-}" ] || { echo "no CLOUDFLARE_ZONE_ID variable — skipping"; exit 0; }
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }

          if api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/theatrium-web/domains"                | grep -q "\"$HOST\""; then
            echo "custom domain already attached"
          else
            echo "attaching $HOST to the Pages project"
            api -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/theatrium-web/domains"               --data "{\"name\":\"$HOST\"}" | jq -r '.success, (.errors // [])[]?.message'
          fi

          if api "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?name=$HOST"                | jq -e '.result | length > 0' >/dev/null; then
            echo "DNS record already present"
          else
            echo "creating CNAME $HOST -> theatrium-web.pages.dev (proxied)"
            api -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records"               --data '{"type":"CNAME","name":"theatrium","content":"theatrium-web.pages.dev","proxied":true,"comment":"new restaurant site (staging)"}'               | jq -r '.success, (.errors // [])[]?.message'
          fi

      # The daily offer's staff key (DAILY-OFFER.md). Stored as a GitHub secret
      # and copied onto the Pages project on every deploy, so rotating it is
      # `gh secret set STAFF_KEY -e theatrium` and a re-run — nobody needs a
      # Cloudflare login. Non-fatal and skipped when unset: without it /kuhinja/
      # simply says the key is not configured, and the rest of the site is fine.
      - name: Set the daily-offer staff key
        continue-on-error: true
        working-directory: web
        env:
          STAFF_KEY: ${{ secrets.STAFF_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "${STAFF_KEY:-}" ] || { echo "no STAFF_KEY secret — skipping"; exit 0; }
          printf '%s' "$STAFF_KEY" | npx wrangler pages secret put STAFF_KEY --project-name theatrium-web

      # Novo vino (WINE-INTAKE.md): the worker key the GitHub runs report with,
      # the token that may only start the two workflows, and the owner's on/off
      # switch. Same pattern as STAFF_KEY: GitHub holds them, every deploy
      # copies them, rotating is `gh secret set … -e theatrium` and a re-run.
      # An unset one is skipped, and the inbox then simply holds requests.
      - name: Set the Novo vino keys
        continue-on-error: true
        working-directory: web
        env:
          WINE_WORKER_KEY: ${{ secrets.WINE_WORKER_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          WINE_INTAKE_ENABLED: ${{ vars.WINE_INTAKE_ENABLED }}
          WINE_READ_KEY: ${{ secrets.WINE_READ_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in WINE_WORKER_KEY GH_DISPATCH_TOKEN WINE_INTAKE_ENABLED WINE_READ_KEY NTFY_TOPIC; do
            val="${!name:-}"
            [ -n "$val" ] || { echo "no $name — skipping"; continue; }
            printf '%s' "$val" | npx wrangler pages secret put "$name" --project-name theatrium-web > /dev/null && echo "set $name"
          done

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # Use the wrangler from package.json rather than letting the action
          # npx-fetch one: a non-interactive runner cannot answer npx's
          # install prompt, and the version should be pinned anyway.
          packageManager: npm
          wranglerVersion: "3.114.17"
          command: pages deploy dist --project-name=theatrium-web --branch=main
