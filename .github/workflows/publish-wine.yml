# Novo vino — publish a finished card (web/WINE-INTAKE.md).
#
# Started ONLY by the inbox, when Filho taps "Objavi na karti" on a card that
# is `ready`. No Claude here. Squash-merges wine/<id> onto main, re-validates
# against today's main (prices and 86s may have moved since the card was
# written), pushes, and starts the two deploys — a push made with
# GITHUB_TOKEN does not trigger other workflows by itself.
name: Dodaj vino — publish

on:
  workflow_dispatch:
    inputs:
      id:
        description: "inbox request id"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: wine-publish
  cancel-in-progress: false

env:
  INBOX: https://theatrium.devinos.hr/api/vina
  ID: ${{ inputs.id }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: wine-intake
    timeout-minutes: 10
    steps:
      - name: Check the id and the request
        id: req
        env:
          KEY: ${{ secrets.WINE_WORKER_KEY }}
        run: |
          set -euo pipefail
          # In RUNNER_TEMP, not the workspace: actions/checkout below cleans
          # the workspace, and took req.json with it (2026-10-11).
          cd "$RUNNER_TEMP"
          [[ "$ID" =~ ^[0-9]{8}-[0-9a-f]{12}$ ]] || { echo "bad id"; exit 1; }
          curl -sfS -H "Authorization: Bearer $KEY" "$INBOX/$ID" > req.json
          jq -e '.item.status == "publishing"' req.json > /dev/null || { echo "not publishing"; exit 1; }
          echo "ref=$(jq -r .item.ref req.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.item.result.draft.wine | .producer + ": " + .name' req.json)" >> "$GITHUB_OUTPUT"
          # who tapped "Objavi" on the device (letters only), and who sent it
          echo "by=$(jq -r '.item.published_by // ""' req.json | tr -cd '[:alpha:] .-' | cut -c1-40)" >> "$GITHUB_OUTPUT"
          echo "sent=$(jq -r '.item.created_by // ""' req.json | tr -cd '[:alpha:] .-' | cut -c1-40)" >> "$GITHUB_OUTPUT"

      # main as it is NOW, not the commit main was at when Filho tapped: the
      # concurrency group can hold this run while another publish lands, and
      # the dispatch SHA then predates it (2026-11-17: Clos des Jacobins was
      # merged onto a main without Lageder's card, and the push was refused).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Merge, validate, push
        id: merge
        env:
          KEY: ${{ secrets.WINE_WORKER_KEY }}
          # Through the environment, never ${{ }} inside the script: the title
          # is a wine name the model wrote, and must not be parsed as shell.
          TITLE: ${{ steps.req.outputs.title }}
          REF: ${{ steps.req.outputs.ref }}
          BY: ${{ steps.req.outputs.by }}
          SENT: ${{ steps.req.outputs.sent }}
        run: |
          set -euo pipefail
          # each step shown to Filho under the request, best effort
          phase() { curl -sS -X POST -H "Authorization: Bearer $KEY" -H "content-type: application/json"                       -d "$(jq -nc --arg p "$1" '{phase: $p}')" "$INBOX/$ID/stanje" > /dev/null || true; }
          phase "Spaja vino s kartom"
          git config user.name "Dodaj vino"
          git config user.email "novo-vino@users.noreply.github.com"
          git fetch origin "wine/$ID"
          # Cards written side by side all append to the same file ends, so
          # the second one published conflicts textually; replay it as data
          # instead (.github/wine-intake/replay.py says why).
          if ! git merge --squash "origin/wine/$ID"; then
            git reset -q --hard HEAD
            phase "Spaja uz ostala nova vina"
            python3 .github/wine-intake/replay.py "$REF" "origin/wine/$ID"
          fi
          sed -i 's/\r$//' library/wines.json lists/theatrium.json data/producers.json data/unavailable.json js/zh-terms.js js/i18n.js js/spirits.js
          # Prices are Filho's and may have been corrected on the preview after
          # the card was written: the request holds the latest. Set them on this
          # wine's new listings — glass in the glass section, bottle elsewhere.
          python3 - "$RUNNER_TEMP/req.json" <<'PY'
          import json, os, sys
          req = json.load(open(sys.argv[1], encoding="utf-8"))["item"]
          ref, pb, pg = req["ref"], req.get("price_bottle"), req.get("price_glass")
          # NOVO: Filho's last tap on the preview, else what the run proposed.
          taps = [a for a in req.get("answers") or [] if a.get("kind") == "novo"]
          novo = bool(taps[-1]["to"]) if taps else (req.get("result") or {}).get("novo", True) is not False
          # glass -> glass price, bottle-* -> bottle price, any other shelf
          # (spirits, rakija, liqueurs) sells one pour: the čaša figure, or
          # the bottle one if that is all Filho gave (scripts/card-placement.mjs).
          def want_for(sid):
              if sid == "glass": return pg
              if sid.startswith("bottle-"): return pb
              return pg if pg is not None else pb
          p = "lists/theatrium.json"
          doc = json.load(open(p, encoding="utf-8"))
          mine = []
          for sec in doc["sections"]:
              for cat in sec["categories"]:
                  for g in cat["groups"]:
                      for it in g["items"]:
                          if it.get("ref") == ref and "anchor" not in it:
                              mine.append((sec["id"], it))
          # A price Filho cleared on the preview takes its listing with it
          # (2026-11-20, El Molar: a glass listing with no glass price went
          # live at the bottle's 75 €). Only listings this card added: what
          # main already had (HEAD, before the merge) is never touched.
          import subprocess
          base = json.loads(subprocess.run(["git", "show", "HEAD:" + p], capture_output=True, text=True, check=True).stdout)
          had = {}
          for sec in base["sections"]:
              for cat in sec["categories"]:
                  for g in cat["groups"]:
                      for it in g["items"]:
                          if it.get("ref") == ref:
                              k = (sec["id"], cat["id"], it.get("vol") or 0.75); had[k] = had.get(k, 0) + 1
          for sec in doc["sections"]:
              for cat in sec["categories"]:
                  for g in cat["groups"]:
                      for it in list(g["items"]):
                          if it.get("ref") != ref: continue
                          k = (sec["id"], cat["id"], it.get("vol") or 0.75)
                          if had.get(k, 0) > 0: had[k] -= 1; continue
                          if want_for(sec["id"]) is None:
                              g["items"].remove(it)
                              mine = [(s, x) for s, x in mine if x is not it]
          # This wine's listings added on the branch (no anchor). One bottle
          # listing takes the bottle price; with several sizes, only the size
          # Filho asked for (an auto-detected size is the single listing).
          bottles = [it for s, it in mine if s.startswith("bottle-")]
          for sid, it in mine:
              if novo: it["new"] = True
              else: it.pop("new", None)
              want = want_for(sid)
              if sid.startswith("bottle-") and len(bottles) > 1 and (it.get("vol") or 0.75) != (req.get("vol") or 0.75):
                  continue   # a magnum beside it keeps its own price
              if want is not None:
                  it["price"] = int(want) if float(want).is_integer() else want
          # the commit title says what was published, NOVO or not
          open(os.environ["RUNNER_TEMP"] + "/novo", "w").write("1" if novo else "")
          open(p, "w", encoding="utf-8", newline="\n").write(json.dumps(doc, ensure_ascii=False, indent=1) + "\n")
          PY
          # …and every price Filho gave has its listing: čaša on the glass
          # list, boca among the bottles (scripts/card-placement.mjs).
          if ! node scripts/card-placement.mjs --base HEAD --request "$RUNNER_TEMP/req.json" --result "$RUNNER_TEMP/no-result.json" --ref "$REF"; then
            echo "placement" > "$RUNNER_TEMP/why"; exit 1
          fi
          phase "Provjerava cijelu kartu"
          # What reaches main is data only, whoever wrote or published the
          # card (web/ROLES.md): the same check as when the card was written.
          git diff HEAD > "$RUNNER_TEMP/publish.patch"
          node scripts/check-card-patch.mjs "$RUNNER_TEMP/publish.patch"
          node --check js/zh-terms.js && node --check js/i18n.js && node --check js/spirits.js
          node scripts/validate.mjs
          phase "Sprema na kartu"
          who="${BY:-Filho}"
          email="$(printf '%s' "$who" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')@theatrium-admin.invalid"
          if [ -s "$RUNNER_TEMP/novo" ]; then joins="joins NOVO"; else joins="joins the list"; fi
          git commit -q --author="$who <$email>" -m "$TITLE $joins — $who" \
                     -m "Added through Dodaj vino (request $ID): sent by ${SENT:-?}, published by $who from /admin."
          # A price or an 86 from /admin can land in the seconds between the
          # checkout and here: replay this commit on top and try again.
          for try in 1 2 3; do
            git push origin HEAD:main && break
            [ "$try" = 3 ] && exit 1
            git fetch -q origin main && git rebase -q origin/main && node scripts/validate.mjs
          done
          git push origin --delete "wine/$ID" || true

      - name: Start the deploys
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.WINE_WORKER_KEY }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $KEY" -H "content-type: application/json"                -d '{"phase":"Šalje na tablete i web"}' "$INBOX/$ID/stanje" > /dev/null || true
          gh workflow run deploy.yml --ref main
          gh workflow run deploy-web.yml --ref main

      - name: Report to the inbox
        if: always()
        env:
          KEY: ${{ secrets.WINE_WORKER_KEY }}
          OK: ${{ steps.merge.outcome }}
          REF: ${{ steps.req.outputs.ref }}
        run: |
          if [ "$OK" = "success" ]; then
            body=$(jq -nc --arg r "$REF" '{status: "published", ref: $r}')
          else
            # back to ready, so "Objavi" can simply be tapped again
            body='{"status":"ready","error":"Objava nije uspjela — pokušajte ponovno za minutu. Ako se ponovi, javite vlasniku."}'
            if [ "$(cat "$RUNNER_TEMP/why" 2>/dev/null)" = placement ]; then
              body='{"status":"ready","error":"Cijena čaše ili boce ne odgovara mjestu na karti. Ako ste cijenu čaše dodali naknadno: objavite bez nje, pa na Karti tapnite „+ čaša”."}'
            fi
          fi
          curl -sS -X POST -H "Authorization: Bearer $KEY" -H "content-type: application/json" -d "$body" "$INBOX/$ID/stanje"
