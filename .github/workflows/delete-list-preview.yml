# One-off: delete the Cloudflare Pages project `theatrium-list-preview`
# (owner, 2026-10-02). Manual trigger only. The project name is fixed here and
# checked again before the call, so this cannot touch theatrium-web or anything
# else. Removed from the repo straight after it has run.
name: Delete list preview project (one-off)

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    environment: theatrium
    steps:
      - name: Delete theatrium-list-preview
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: theatrium-list-preview
        run: |
          set -euo pipefail
          [ "$PROJECT" = "theatrium-list-preview" ] || { echo "refusing: $PROJECT"; exit 1; }
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "$@"; }
          echo "projects before:"; api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | jq -r '.result[].name'
          api -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT" | jq -c '{success, errors}'
          echo "projects after:"; api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" | jq -r '.result[].name'
