name: Tests

# On demand only. The owner runs this as a regression check against a commit of
# their choosing, not on every push:
#
#   gh workflow run test.yml --ref <branch-or-tag>
#
# or from the Actions tab. For an arbitrary commit, run it locally instead:
#
#   git checkout <sha> && npm ci && npm test
on:
  workflow_dispatch:
  workflow_call:          # so it can still be required from another workflow

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Syntax-check every script the page loads
        run: |
          for f in js/*.js scripts/*.mjs; do node --check "$f"; done

      - name: Validate the wine data
        run: node scripts/validate.mjs

      - run: npm ci

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Regression suite
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
