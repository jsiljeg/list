# Novo vino — write one wine card with Claude (web/WINE-INTAKE.md).
#
# Started ONLY by the inbox on theatrium.devinos.hr (workflow_dispatch with a
# fine-grained token that can do nothing but start workflows). No push, PR,
# issue or comment trigger exists, so nobody outside the repo can start it, and
# its only input is a request id — nothing Filho types reaches this file.
#
# Two jobs, so the model never holds a credential that can write:
#   write   Claude + the add-wine skill. Read-only token, no stored git
#           credentials, tools allow-listed (no free shell), and the worker
#           key is never in its environment. Produces a patch and result.json.
#   commit  No Claude. Checks the patch touches only data files, applies it,
#           runs validate.mjs, pushes branch wine/<id>, reports to the inbox.
name: Dodaj vino — write

on:
  workflow_dispatch:
    inputs:
      id:
        description: "inbox request id"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wine-intake
  cancel-in-progress: false

env:
  INBOX: https://theatrium.devinos.hr/api/vina
  ID: ${{ inputs.id }}

jobs:
  write:
    runs-on: ubuntu-latest
    environment: wine-intake
    timeout-minutes: 35
    outputs:
      status: ${{ steps.out.outputs.status }}
      mode: ${{ steps.fetch.outputs.mode }}
    steps:
      - name: Check the id
        run: '[[ "$ID" =~ ^[0-9]{8}-[0-9a-f]{12}$ ]] || { echo "bad id"; exit 1; }'

      - name: Fetch the request and its photos
        id: fetch
        env:
          KEY: ${{ secrets.WINE_WORKER_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intake"
          curl -sfS -H "Authorization: Bearer $KEY" "$INBOX/$ID" > "$RUNNER_TEMP/req.json"
          jq -e '.item.status == "working"' "$RUNNER_TEMP/req.json" > /dev/null || { echo "not working"; exit 1; }
          # edit mode: the preview was edited, so start from the card's branch
          mode=add
          if jq -e '(.item.branch != "") and (([.item.answers[] | select(.kind != "novo")] | last | .kind) == "edit")' "$RUNNER_TEMP/req.json" > /dev/null; then mode=edit; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.item.branch' "$RUNNER_TEMP/req.json")" >> "$GITHUB_OUTPUT"
          for n in $(jq -r '.item.photos[]' "$RUNNER_TEMP/req.json"); do
            curl -sfS -H "Authorization: Bearer $KEY" "$INBOX/$ID/foto/$n" -o "$RUNNER_TEMP/intake/photo-$n.jpg"
          done
          # round = Claude runs so far (the inbox counted this one); questions
          # stop after two rounds of answers — then the card is finished with
          # what is known, never another question.
          jq --arg mode "$mode" '.item as $i | {
              mode: $mode, round: $i.runs,
              final: (([$i.answers[] | select(.kind == null)] | map(.at) | unique | length) >= 2),
              price_bottle: $i.price_bottle, price_glass: $i.price_glass, vol: $i.vol,
              recommended: $i.recommended, remark: $i.remark,
              answers: [$i.answers[] | select(.kind == null) | {q, a}],
              edits: [$i.answers[] | select(.kind == "edit") | {field, from, to}],
              ratings_given: ([$i.answers[] | select(.kind == "ratings") | .to] | last // ""),
              photos: [$i.photos[] | "intake/photo-\(.).jpg"] }' "$RUNNER_TEMP/req.json" > "$RUNNER_TEMP/intake/request.json"
          # What the progress list says first (owner, 2026-10-19: a correction
          # run opened with "Čita etiketu" and looked like a fresh start). An
          # edit run names the fields of the batch just sent, in the preview's
          # own words; the label is read only if Claude actually opens it.
          if [ "$mode" = edit ]; then
            what=$(jq -r '[.item.answers[] | select(.kind == "edit")] as $e
              | ($e | map(.at) | max) as $last
              | [$e[] | select(.at == $last) | .field] | unique
              | map({price_bottle:"cijena boce", price_glass:"cijena čaše", grape:"sorta", region:"regija",
                     terroir:"položaj", alcohol:"alkohol", temp:"posluživanje", ratings:"ocjene",
                     note:"bilješka", blurb:"priča o vinariji", komentar:"tvoja napomena"}[.] // .)
              | join(", ")' "$RUNNER_TEMP/req.json")
            first="Ispravak — priprema"; second="Ispravlja: ${what:-karticu}"
          else
            first="Pokrenuto — priprema"; second="Čita etiketu"
          fi
          echo "second=$second" >> "$GITHUB_OUTPUT"
          curl -sfS -X POST -H "Authorization: Bearer $KEY" -H "content-type: application/json" \
               -d "$(jq -nc --arg u "$RUN_URL" --arg p "$first" '{status:"working", run_url:$u, phase:$p, reset:true}')" "$INBOX/$ID/stanje" > /dev/null

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ steps.fetch.outputs.mode == 'edit' && steps.fetch.outputs.branch || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Put the intake beside the repo
        run: cp -r "$RUNNER_TEMP/intake" intake

      # The two helpers always come from main: an edit run checks out the
      # card's branch, which may predate them.
      - name: Fetch the helpers from main
        run: |
          for f in progress.mjs producer-known.mjs; do
            curl -sfS "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/wine-intake/$f" -o "$RUNNER_TEMP/$f" || true
          done

      # Always the newest CLI, and the alias rather than a model id, so the
      # newest Opus is used the day it ships (owner, 2026-10-10: Opus by
      # default; `fable`, the frontier tier, spends the subscription faster).
      # Set the repo/environment variable WINE_MODEL=fable to switch.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Write the card
        id: claude
        env:
          TOKEN_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          MODEL: ${{ vars.WINE_MODEL || 'opus' }}
          # For progress.mjs only — removed from Claude's environment below.
          WK: ${{ secrets.WINE_WORKER_KEY }}
          SECOND: ${{ steps.fetch.outputs.second }}
        run: |
          set -uo pipefail
          # If progress.mjs could not be fetched there is no live progress,
          # but the run is unaffected.
          curl -sS -X POST -H "Authorization: Bearer $WK" -H "content-type: application/json" \
               -d "$(jq -nc --arg p "$SECOND" '{phase:$p}')" "$INBOX/$ID/stanje" > /dev/null || true
          # The settings deny reading anything outside the checkout, so the
          # token in this process's environment cannot be read back through a
          # file tool and handed to a web fetch.
          cat > "$RUNNER_TEMP/settings.json" <<'JSON'
          { "permissions": {
              "deny": ["Read(/proc/**)", "Read(/sys/**)", "Read(/etc/**)", "Read(/root/**)",
                       "Read(/home/runner/work/_temp/**)", "Read(/home/runner/.claude/**)",
                       "Read(/home/runner/.config/**)", "Read(/home/runner/.gitconfig)",
                       "Read(/tmp/**)", "Read(/opt/**)", "Read(/usr/**)", "Read(/var/**)",
                       "Edit(.github/**)", "Write(.github/**)", "Edit(.claude/**)", "Write(.claude/**)"] } }
          JSON
          tools='Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Skill'
          tools+=',Bash(node scripts/validate.mjs),Bash(node scripts/after-86.mjs)'
          tools+=',Bash(node .claude/skills/add-wine/neighbours.mjs:*),Bash(python3 .claude/skills/add-wine/add.py:*)'
          tools+=',Bash(node .claude/skills/sommelier/pair.mjs:*),Bash(python3 scripts/rank-ratings.py)'
          # Streamed, so each step can be shown to Filho as it happens; the
          # stream is kept, and its final "result" event is the old JSON output.
          # Two subscriptions (2026-10-13): if the first account has hit its
          # usage limit, the same run goes again on the second, when it is set.
          # bash -e is GitHub's default shell, and claude exits 1 on a usage
          # limit: that ended the step before the second account was tried
          # (2026-10-15, every wine and receipt failed in 2 seconds)
          set +e
          for T in "$TOKEN_1" "$TOKEN_2"; do
            [ -n "$T" ] || continue
            env -u WK -u TOKEN_1 -u TOKEN_2 CLAUDE_CODE_OAUTH_TOKEN="$T" claude -p "$(cat .github/wine-intake/prompt.md)" \
              --model "$MODEL" --fallback-model sonnet \
              --max-turns 120 \
              --settings "$RUNNER_TEMP/settings.json" \
              --allowedTools "$tools" \
              --output-format stream-json --verbose \
              | tee "$RUNNER_TEMP/stream.jsonl" \
              | { if [ -f "$RUNNER_TEMP/progress.mjs" ]; then KEY="$WK" node "$RUNNER_TEMP/progress.mjs"; else cat > /dev/null; fi; }
            code=${PIPESTATUS[0]}
            jq -s '[.[] | select(.type == "result")] | last // {}' "$RUNNER_TEMP/stream.jsonl" > "$RUNNER_TEMP/claude.json"
            jq -e '.is_error == true and ((.result // "") | test("usage limit reached|hit your ([a-z0-9-]+ )?limit|out of (extra )?usage"; "i"))' \
              "$RUNNER_TEMP/claude.json" > /dev/null || break
            echo "::warning::Claude account hit its usage limit — trying the next one"
          done
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          jq '{turns: .num_turns, seconds: ((.duration_ms // 0) / 1000 | floor), cost_usd: .total_cost_usd,
               model: (.modelUsage // {} | keys)}' "$RUNNER_TEMP/claude.json" > "$RUNNER_TEMP/usage.json" || echo '{}' > "$RUNNER_TEMP/usage.json"
          cat "$RUNNER_TEMP/usage.json"

      - name: Collect the result
        id: out
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$RUNNER_TEMP/usage.json" out/usage.json
          # "ready" with no change to the data is the same answer as
          # "already_listed": the wine is on the list and nothing was added.
          if [ -f intake/result.json ] && jq -e '.status == "ready"' intake/result.json > /dev/null \
             && git diff --quiet -- library lists data js; then
            jq '.status = "already_listed"' intake/result.json > intake/r.tmp && mv intake/r.tmp intake/result.json
          fi
          # Whether the winery is new or already on the list, read from the
          # files rather than taken from the model (owner, 2026-10-11).
          if [ -f intake/result.json ] && [ -f "$RUNNER_TEMP/producer-known.mjs" ]; then
            node "$RUNNER_TEMP/producer-known.mjs" intake/result.json || true
          fi
          if [ -f intake/result.json ] && jq -e '.status == "ready" or .status == "needs_info" or .status == "already_listed"' intake/result.json > /dev/null; then
            cp intake/result.json out/result.json
            echo "status=$(jq -r .status intake/result.json)" >> "$GITHUB_OUTPUT"
          elif jq -e '.is_error == true and ((.result // "") | test("usage limit reached|hit your ([a-z0-9-]+ )?limit|out of (extra )?usage"; "i"))' \
               "$RUNNER_TEMP/claude.json" > /dev/null 2>&1; then
            # both accounts at their limit: nothing was tried, so the wine goes
            # back in line instead of failing (2026-10-15)
            echo '{"status":"retry"}' > out/result.json
            echo "status=retry" >> "$GITHUB_OUTPUT"
          else
            echo '{"status":"failed","error":"Kartica nije dovršena — pokušajte ponovno."}' > out/result.json
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
          git diff --binary -- library lists data js > out/card.patch || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: card
          path: out/
          retention-days: 30

  commit:
    needs: write
    if: always() && needs.write.result != 'skipped'
    runs-on: ubuntu-latest
    environment: wine-intake
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: card
          path: out

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply, validate, push wine/<id>
        id: apply
        if: needs.write.outputs.status == 'ready'
        env:
          MODE: ${{ needs.write.outputs.mode }}
          KEY: ${{ secrets.WINE_WORKER_KEY }}
          PU: ${{ secrets.PARKER_USER }}
          PP: ${{ secrets.PARKER_PASS }}
        run: |
          set -euo pipefail
          curl -sS -X POST -H "Authorization: Bearer $KEY" -H "content-type: application/json" \
               -d '{"phase":"Provjerava i sprema karticu"}' "$INBOX/$ID/stanje" > /dev/null || true
          branch="wine/$ID"
          if [ "$MODE" = "edit" ]; then git checkout "$branch"; else git checkout -B "$branch" origin/main; fi
          # The model may only have changed data files; anything else in the
          # patch means something went wrong, and nothing is applied.
          bad=$(grep '^diff --git' out/card.patch | awk '{print $3}' | sed 's#^a/##' \
                | grep -vE '^(library/wines\.json|lists/theatrium\.json|data/producers\.json|data/unavailable\.json|js/zh-terms\.js|js/i18n\.js)$' || true)
          [ -z "$bad" ] || { echo "patch touches $bad"; exit 1; }
          [ -s out/card.patch ] || { echo "empty patch"; exit 1; }
          git apply --whitespace=nowarn out/card.patch
          # The repo stores LF; a CR that slipped in turns a 50-line card into
          # a rewrite of every line of the data files.
          sed -i 's/\r$//' library/wines.json lists/theatrium.json data/producers.json data/unavailable.json js/zh-terms.js js/i18n.js
          git diff --stat
          node --check js/zh-terms.js && node --check js/i18n.js
          node scripts/validate.mjs

          # Robert Parker, looked up here on the commercial subscription
          # (owner, 2026-10-11). A fixed script, no AI: the password and the
          # logged-in page never reach Claude. Skipped when the card already
          # has a Parker score (given up front, or a wine we already pour), and
          # on a correction run (owner, 2026-10-19): the first run already
          # looked, and a correction does not change what Parker scored. A miss
          # is still caught by the daily pr-checkups sweep.
          ref=$(jq -r '.ref // empty' out/result.json)
          if [ "$MODE" != edit ] && [ -n "$ref" ] && ! jq -e --arg r "$ref" '[.wines[$r].ratings // [] | .[] | select(.critic == "Robert Parker")] | length > 0' library/wines.json > /dev/null; then
            curl -sS -X POST -H "Authorization: Bearer $KEY" -H "content-type: application/json" \
                 -d '{"phase":"Provjerava ocjenu Roberta Parkera"}' "$INBOX/$ID/stanje" > /dev/null || true
            mkdir -p "$RUNNER_TEMP/rp"
            if curl -sfS "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/wine-intake/parker.mjs" -o "$RUNNER_TEMP/rp/parker.mjs" \
               && (cd "$RUNNER_TEMP/rp" && npm init -y > /dev/null && npm install --no-save --silent playwright-core@1.62.0 \
                   && npx --yes playwright@1.62.0 install --with-deps chromium > /dev/null 2>&1); then
              producer=$(jq -r --arg r "$ref" '.wines[$r].producer' library/wines.json)
              wname=$(jq -r --arg r "$ref" '.wines[$r].name' library/wines.json)
              PARKER_USER="$PU" PARKER_PASS="$PP" node "$RUNNER_TEMP/rp/parker.mjs" "$RUNNER_TEMP/parker.json" "$producer" "$wname" || true
            fi
            [ -f "$RUNNER_TEMP/parker.json" ] || echo '{"status":"error","note":"lookup did not run"}' > "$RUNNER_TEMP/parker.json"
            if jq -e '.status == "found"' "$RUNNER_TEMP/parker.json" > /dev/null; then
              python3 scripts/parker-add.py "$ref" "$(jq -r .score "$RUNNER_TEMP/parker.json")"
              python3 scripts/rank-ratings.py
              sed -i 's/\r$//' library/wines.json
              node scripts/validate.mjs
            fi
            # what Filho reads: the score on the card, or why it is not there
            python3 - "$ref" "$RUNNER_TEMP/parker.json" out/result.json <<'PY'
          import json, sys
          ref, pj, rj = sys.argv[1:4]
          p = json.load(open(pj, encoding="utf-8"))
          r = json.load(open(rj, encoding="utf-8"))
          lib = json.load(open("library/wines.json", encoding="utf-8"))["wines"]
          gaps = [g for g in r.get("gaps") or [] if "parker" not in g.lower()]
          flags = list(r.get("flags") or [])
          st = p.get("status")
          if st == "none":
              gaps.append("Parker još nije ocijenio ovu berbu — provjerava se ponovno svaki dan")
          elif st != "found":
              gaps.append("Parker nije provjeren")
              cands = "; ".join("%s %s" % (c.get("title", ""), c.get("score", "")) for c in (p.get("candidates") or [])[:5])
              flags.append("Parker lookup: %s — %s%s" % (st, p.get("note", ""), (" | " + cands) if cands else ""))
          r["gaps"], r["flags"] = gaps, flags
          r["parker"] = {k: p.get(k) for k in ("status", "score", "match", "note")}
          if r.get("draft") and r["draft"].get("wine") is not None and ref in lib:
              r["draft"]["wine"]["ratings"] = lib[ref].get("ratings", [])
          open(rj, "w", encoding="utf-8").write(json.dumps(r, ensure_ascii=False, indent=1) + "\n")
          print("parker:", st, p.get("score") or "", p.get("note") or "")
          PY
          fi

          git config user.name "Dodaj vino"
          git config user.email "novo-vino@users.noreply.github.com"
          git add library lists data js
          git commit -q -m "Dodaj vino ($ID): $(jq -r '.draft.wine.producer + " — " + .draft.wine.name' out/result.json)" \
                     -m "$(jq -r '.notes // ""' out/result.json)"
          git push -f origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Report to the inbox
        if: always()
        env:
          KEY: ${{ secrets.WINE_WORKER_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ needs.write.outputs.status }}
          APPLIED: ${{ steps.apply.outcome }}
          BRANCH: ${{ steps.apply.outputs.branch }}
        run: |
          set -uo pipefail
          usage=$(cat out/usage.json 2>/dev/null || echo '{}')
          if [ "$STATUS" = "retry" ]; then
            # Claude refused at once on both accounts: back in line, not counted
            body=$(jq -nc --argjson u "$usage" --arg run "$RUN_URL" '{status: "retry", usage: $u, run_url: $run}')
          elif [ "$STATUS" = "already_listed" ]; then
            # Not a failure, but nothing to publish: say so plainly, in Croatian.
            body=$(jq -c --argjson u "$usage" --arg run "$RUN_URL" \
              '{status: "failed", usage: $u, run_url: $run,
                error: ("Ovo vino je već na karti — ništa nije dodano." + (if .placement then " " + .placement else "" end)
                        + " Ako je druga berba ili veličina, napišite to u napomeni i pošaljite ponovno.")}' out/result.json)
          elif [ "$STATUS" = "needs_info" ]; then
            body=$(jq -c --argjson u "$usage" --arg run "$RUN_URL" '{status: "needs_info", questions: .questions, usage: $u, run_url: $run}' out/result.json)
          elif [ "$STATUS" = "ready" ] && [ "$APPLIED" = "success" ]; then
            body=$(jq -c --argjson u "$usage" --arg run "$RUN_URL" --arg b "$BRANCH" \
              '{status: "ready", branch: $b, ref: .ref, usage: $u, run_url: $run,
                result: {draft, glass, placement, gaps, pairings_hr, notes, flags, novo, novo_reason,
                         producer_status, producer_known, producer_note, parker}}' out/result.json)
          else
            err="Kartica nije prošla provjeru — vlasnik je obaviješten."
            [ "$STATUS" = "failed" ] && err="Kartica nije dovršena — pokušajte ponovno."
            body=$(jq -nc --arg e "$err" --argjson u "$usage" --arg run "$RUN_URL" '{status: "failed", error: $e, usage: $u, run_url: $run}')
          fi
          curl -sS -X POST -H "Authorization: Bearer $KEY" -H "content-type: application/json" -d "$body" "$INBOX/$ID/stanje"
